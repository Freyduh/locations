<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTA V Location Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Bowlby+One&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Pricedown';src:url('fonts/pricedown.woff2') format('woff2'),url('fonts/pricedown.ttf') format('truetype');font-display:swap}
:root{--sea:#c1e2f7;--panel:rgba(0,0,0,.8);--ink:#fff;--mute:#b9b9b9;--line:rgba(255,255,255,.22);--gold:#ffc72c;--head:'Pricedown','Bowlby One',Impact,'Arial Black',sans-serif;--ui:'Barlow Condensed','Chalet','Arial Narrow',Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--sea);color:var(--ink);font:500 17px/1.35 var(--ui);letter-spacing:.02em;overflow:hidden}
#view{user-select:none;-webkit-user-select:none;position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden}
#view.add{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world img{display:block;user-select:none;-webkit-user-drag:none}
.star{position:absolute;width:0;height:0}
.star svg{position:absolute;left:-6px;top:-6px;width:12px;height:12px;transform:scale(var(--s,1));overflow:visible;cursor:pointer;filter:drop-shadow(0 0 1px #000)}
.star path{fill:var(--gold);stroke:#000;stroke-width:1.4}
.star.pending path{fill:#fff;stroke:#e11}
.bar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;z-index:5;pointer-events:none}
.bar>*{pointer-events:auto}
.col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
button{font:600 16px var(--ui);letter-spacing:.08em;text-transform:uppercase;background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:0;padding:8px 14px;cursor:pointer}
button:hover,button[aria-selected="true"]{background:#fff;color:#000;border-color:#fff}
button.primary{background:var(--gold);color:#000;border-color:#000}
button.primary:hover{background:#fff}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pill{background:var(--panel);border-left:4px solid var(--gold);padding:7px 14px;text-transform:uppercase;letter-spacing:.08em;font-size:15px;font-weight:600;color:#fff}
#hint{display:none;color:var(--gold)}
.zoom{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:42px;height:42px;padding:0;font-size:24px;line-height:1}
.card,.guide{position:absolute;z-index:9;background:var(--panel);backdrop-filter:blur(3px);border-top:4px solid var(--gold);padding:14px;color:#fff;display:none}
.card{z-index:8;width:min(320px,calc(100% - 20px));left:10px;top:calc(110px + env(safe-area-inset-top,0px))}
.card h3,.guide h3{font-family:var(--head);font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.card h3{margin:0 34px 6px 0;font-size:22px}
.card img{width:100%;display:block;margin:8px 0;max-height:240px;object-fit:cover}
.card .x,.guide .x{position:absolute;right:6px;top:8px;padding:0 9px;font-size:20px;line-height:1.3}
.card label{display:block;margin:10px 0 4px;color:var(--mute);text-transform:uppercase;font-size:14px;letter-spacing:.08em}
.card input[type=text]{width:100%;padding:8px;border-radius:0;border:1px solid var(--line);background:#000;color:#fff;font:500 17px var(--ui)}
.card .row{display:flex;gap:8px;margin-top:12px}
.msg{color:var(--mute);margin:8px 0 0;font-size:15px}
</style></head><body>

<div class="bar">
  <div class="col"><button id="addBtn" class="primary">Add a location</button><span class="pill" id="count"></span></div>
  <span id="hint" class="pill">Click the map where it is</span>
</div>
<div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button></div>
<div class="card" id="info"><button class="x" id="infoX" aria-label="Close">&times;</button><h3 id="iTitle"></h3><img id="iImg" alt=""><div class="msg" id="iNote"></div></div>
<div class="card" id="form"><button class="x" id="formX" aria-label="Close">&times;</button>
  <h3>New location</h3>
  <label for="fTitle">Name</label><input type="text" id="fTitle" maxlength="80">
  <label for="fLink">Link to a picture</label><input type="text" id="fLink" placeholder="https://i.imgur.com/example.jpg" inputmode="url">
  <input type="text" id="fWeb" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
  <img id="fPrev" alt="" hidden>
  <div class="row"><button class="primary" id="send">Send location</button><button id="cancel">Cancel</button></div>
  <p class="msg" id="fMsg"></p>
</div>
<script>
/* ============ SETTINGS ============ */
const RELAY_URL = "https://locations.freyaeyo.workers.dev";   // your Cloudflare Worker URL (see SETUP.md)

/* ============ MAP ============ */
const view=document.getElementById('view'),world=document.getElementById('world'),map=document.getElementById('map');
let W=0,H=0,k=1,tx=0,ty=0,adding=false,pending=null;
const $=id=>document.getElementById(id);
const STAR='<svg viewBox="-10 -10 20 20"><path d="M0-9L2.6-3 9-2.8 4.2 1.5 5.6 8 0 4.6-5.6 8-4.2 1.5-9-2.8-2.6-3z"/></svg>';
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${k})`;world.style.setProperty('--s',1/k)}
function clampPan(){const vw=view.clientWidth,vh=view.clientHeight;tx=Math.min(vw*.5,Math.max(vw*.5-W*k,tx));ty=Math.min(vh*.5,Math.max(vh*.5-H*k,ty))}
function zoomAt(px,py,f){const n=Math.min(8,Math.max(Math.min(view.clientWidth/W,view.clientHeight/H)*.9,k*f));tx=px-(px-tx)*(n/k);ty=py-(py-ty)*(n/k);k=n;clampPan();apply()}
function fit(){k=Math.min(view.clientWidth/W,view.clientHeight/H);tx=(view.clientWidth-W*k)/2;ty=(view.clientHeight-H*k)/2;apply()}
const stars=[];
function addStar(l,cls){const d=document.createElement('div');d.className='star'+(cls?' '+cls:'');d.style.left=l.x*W+'px';d.style.top=l.y*H+'px';d.innerHTML=STAR;world.appendChild(d);if(!cls)stars.push(l);return d}
function pickStar(e){const r=view.getBoundingClientRect();let best=null,bd=18;for(const l of stars){const sx=r.left+tx+l.x*W*k,sy=r.top+ty+l.y*H*k;const d=Math.hypot(e.clientX-sx,e.clientY-sy);if(d<bd){bd=d;best=l}}if(best)showInfo(best);else $('info').style.display='none'}
function showInfo(l){$('form').style.display='none';$('iTitle').textContent=l.title||'Location';const i=$('iImg');if(l.img){i.src=l.img;i.style.display='block'}else i.style.display='none';$('iNote').textContent=l.img?'':'No picture yet.';$('info').style.display='block'}
function init(){W=map.naturalWidth;H=map.naturalHeight;map.width=W;map.height=H;fit();loadLocations()}
function loadLocations(){fetch('locations.json',{cache:'no-store'}).then(r=>r.json()).then(a=>{a.forEach(l=>addStar(l));$('count').textContent=a.length+(a.length===1?' location':' locations')}).catch(()=>{$('count').textContent='Could not load locations'})}
map.complete&&map.naturalWidth?init():map.addEventListener('load',init);
addEventListener('resize',()=>{clampPan();apply()});

/* pan / pinch / wheel */
const pts=new Map();let moved=0,lastD=0;
view.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')pts.clear();try{view.setPointerCapture(e.pointerId)}catch(_){}if(e.button===1)e.preventDefault();pts.set(e.pointerId,{x:e.clientX,y:e.clientY,btn:e.button});moved=0;lastD=0});
view.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;
  if(pts.size===1){tx+=e.clientX-p.x;ty+=e.clientY-p.y;moved+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y);p.x=e.clientX;p.y=e.clientY;clampPan();apply()}
  else{p.x=e.clientX;p.y=e.clientY;const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(lastD)zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/lastD);lastD=d;moved=99}});
const up=e=>{const pp=pts.get(e.pointerId);const wasTap=pts.size===1&&moved<6&&pp&&pp.btn===0;pts.delete(e.pointerId);lastD=0;if(wasTap&&e.type==='pointerup'){if(adding)place(e);else pickStar(e)}};
view.addEventListener('contextmenu',e=>e.preventDefault());
view.addEventListener('dragstart',e=>e.preventDefault());addEventListener('blur',()=>{pts.clear();lastD=0});
view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);view.addEventListener('lostpointercapture',up);
view.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.2:1/1.2)},{passive:false});
$('zin').onclick=()=>zoomAt(view.clientWidth/2,view.clientHeight/2,1.5);
$('zout').onclick=()=>zoomAt(view.clientWidth/2,view.clientHeight/2,1/1.5);

/* ============ ADD FLOW ============ */
function setAdding(on){adding=on;view.classList.toggle('add',on);$('hint').style.display=on?'inline-block':'none';$('addBtn').style.display=on?'none':'inline-block';$('count').style.display=on?'none':'inline-block'}
function resetForm(){setAdding(false);if(pending&&pending.el)pending.el.remove();pending=null;$('form').style.display='none';$('fTitle').value='';$('fLink').value='';$('fPrev').hidden=true;$('fMsg').textContent=''}
$('addBtn').onclick=()=>{$('info').style.display='none';setAdding(true)};
function place(e){const r=world.getBoundingClientRect();const x=(e.clientX-r.left)/(W*k),y=(e.clientY-r.top)/(H*k);if(x<0||y<0||x>1||y>1)return;
  if(pending&&pending.el)pending.el.remove();pending={x:+x.toFixed(4),y:+y.toFixed(4)};pending.el=addStar(pending,'pending');setAdding(false);$('count').style.display='inline-block';$('addBtn').style.display='inline-block';$('form').style.display='block';$('fTitle').focus()}
$('formX').onclick=$('cancel').onclick=resetForm;$('infoX').onclick=()=>$('info').style.display='none';
$('fLink').oninput=()=>{const v=$('fLink').value.trim(),p=$('fPrev');if(/^https:\/\//i.test(v)){p.src=v;p.hidden=false;p.onerror=()=>{p.hidden=true}}else p.hidden=true};
$('send').onclick=async()=>{
  const title=$('fTitle').value.trim(),link=$('fLink').value.trim();
  if(!pending)return;
  if(!title){$('fMsg').textContent='Add a name for this location.';return}
  if(!/^https:\/\/\S+$/i.test(link)){$('fMsg').textContent='Paste a link to a picture (starting with https://).';return}
  if(!RELAY_URL){$('fMsg').textContent='Sending is not set up yet. Add your relay URL in the code.';return}
  $('send').disabled=true;$('fMsg').textContent='Sending...';
  try{const r=await fetch(RELAY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({x:pending.x,y:pending.y,title,link,website:$('fWeb').value})});
    if(!r.ok)throw 0;$('fMsg').textContent='Sent. It will show on the map once approved.';setTimeout(()=>{resetForm();$('send').disabled=false},2200)}
  catch(_){$('fMsg').textContent='Could not send. Try again.';$('send').disabled=false}};

</script></body></html>
