<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTA V Location Map</title>
<style>
:root{--bg:#0f1d24;--panel:#16272f;--ink:#e8f1f4;--mute:#8fa8b3;--line:#2a4350;--star:#ffd23f;--accent:#2fb7d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d24}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#view{position:absolute;inset:0;touch-action:none;cursor:grab;overflow:hidden}
#view.add{cursor:crosshair}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world img{display:block;user-select:none;-webkit-user-drag:none}
.star{position:absolute;width:0;height:0}
.star svg{position:absolute;left:-6px;top:-6px;width:12px;height:12px;transform:scale(var(--s,1));overflow:visible;cursor:pointer;filter:drop-shadow(0 0 1px #000)}
.star path{fill:var(--star);stroke:#3a2b00;stroke-width:1.2}
.star.pending path{fill:#fff;stroke:#e11}
.bar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:10px;display:flex;gap:8px;align-items:center;z-index:5}
button,.btn{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);color:#04202a;border-color:var(--accent);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;color:var(--mute)}
#hint{display:none;color:var(--ink)}
.zoom{position:absolute;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:38px;height:38px;padding:0;font-size:20px}
.card{position:absolute;z-index:8;width:min(320px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;left:10px;top:calc(110px + env(safe-area-inset-top,0px));display:none}
.card img{width:100%;border-radius:6px;display:block;margin:8px 0;max-height:240px;object-fit:cover}
.card h3{margin:0 24px 0 0;font-size:16px}
.card .x{position:absolute;right:6px;top:6px;padding:2px 8px}
.card label{display:block;margin:10px 0 4px;color:var(--mute)}
.card input[type=text]{width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.card input[type=file]{width:100%;color:var(--mute)}
.card .row{display:flex;gap:8px;margin-top:12px}
.msg{color:var(--mute);margin:8px 0 0;font-size:13px}
.guide{position:absolute;z-index:9;right:10px;top:calc(110px + env(safe-area-inset-top,0px));width:min(380px,calc(100% - 20px));max-height:calc(100% - 130px - env(safe-area-inset-top,0px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:none}
.guide h3{margin:10px 0 4px;font-size:15px}
.guide .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-right:34px}
.guide .tabs button{padding:6px 10px}
.guide .tabs button[aria-selected="true"]{background:var(--accent);color:#04202a;border-color:var(--accent);font-weight:600}
.guide table{width:100%;border-collapse:collapse;margin:6px 0}
.guide td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.guide td:first-child{color:var(--mute);width:38%;padding-right:8px}
.guide ol{margin:4px 0 8px;padding-left:20px}.guide li{margin:3px 0}
.guide .x{position:absolute;right:6px;top:6px;padding:2px 8px}
.guide .note{color:var(--mute);font-size:12px;margin:10px 0 0}
.bar{right:10px;flex-wrap:wrap;align-items:flex-start;pointer-events:none}
.bar>*{pointer-events:auto}
.col{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.gbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.gbtns button[aria-selected="true"]{background:var(--accent);color:#04202a;border-color:var(--accent);font-weight:600}
</style></head><body>

let W=0,H=0,k=1,tx=0,ty=0,adding=false,pending=null;
const $=id=>document.getElementById(id);
const STAR='<svg viewBox="-10 -10 20 20"><path d="M0-9L2.6-3 9-2.8 4.2 1.5 5.6 8 0 4.6-5.6 8-4.2 1.5-9-2.8-2.6-3z"/></svg>';
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${k})`;world.style.setProperty('--s',1/k)}
function clampPan(){const vw=view.clientWidth,vh=view.clientHeight;tx=Math.min(vw*.5,Math.max(vw*.5-W*k,tx));ty=Math.min(vh*.5,Math.max(vh*.5-H*k,ty))}
function zoomAt(px,py,f){const n=Math.min(8,Math.max(Math.min(view.clientWidth/W,view.clientHeight/H)*.9,k*f));tx=px-(px-tx)*(n/k);ty=py-(py-ty)*(n/k);k=n;clampPan();apply()}
function fit(){k=Math.min(view.clientWidth/W,view.clientHeight/H);tx=(view.clientWidth-W*k)/2;ty=(view.clientHeight-H*k)/2;apply()}
const stars=[];
function addStar(l,cls){const d=document.createElement('div');d.className='star'+(cls?' '+cls:'');d.style.left=l.x*W+'px';d.style.top=l.y*H+'px';d.innerHTML=STAR;world.appendChild(d);if(!cls)stars.push(l);return d}
function pickStar(e){const r=view.getBoundingClientRect();let best=null,bd=18;for(const l of stars){const sx=r.left+tx+l.x*W*k,sy=r.top+ty+l.y*H*k;const d=Math.hypot(e.clientX-sx,e.clientY-sy);if(d<bd){bd=d;best=l}}if(best)showInfo(best);else $('info').style.display='none'}
function showInfo(l){$('form').style.display='none';$('iTitle').textContent=l.title||'Location';const i=$('iImg');if(l.img){i.src=l.img;i.style.display='block'}else i.style.display='none';$('iNote').textContent=l.img?'':'No picture yet.';$('info').style.display='block'}
function init(){W=map.naturalWidth;H=map.naturalHeight;map.width=W;map.height=H;fit();loadLocations()}
function loadLocations(){fetch('locations.json',{cache:'no-store'}).then(r=>r.json()).then(a=>{a.forEach(l=>addStar(l));$('count').textContent=a.length+(a.length===1?' location':' locations')}).catch(()=>{$('count').textContent='Could not load locations'})}
map.complete&&map.naturalWidth?init():map.addEventListener('load',init);
addEventListener('resize',()=>{clampPan();apply()});

/* pan / pinch / wheel */
const pts=new Map();let moved=0,lastD=0;
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;lastD=0});
view.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;
  if(pts.size===1){tx+=e.clientX-p.x;ty+=e.clientY-p.y;moved+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y);p.x=e.clientX;p.y=e.clientY;clampPan();apply()}
  else{p.x=e.clientX;p.y=e.clientY;const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(lastD)zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/lastD);lastD=d;moved=99}});
const up=e=>{const wasTap=pts.size===1&&moved<6;pts.delete(e.pointerId);lastD=0;if(wasTap&&e.type==='pointerup'){if(adding)place(e);else pickStar(e)}};
view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
view.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.2:1/1.2)},{passive:false});
$('zin').onclick=()=>zoomAt(view.clientWidth/2,view.clientHeight/2,1.5);
$('zout').onclick=()=>zoomAt(view.clientWidth/2,view.clientHeight/2,1/1.5);

/* ============ ADD FLOW ============ */
function setAdding(on){adding=on;view.classList.toggle('add',on);$('hint').style.display=on?'inline-block':'none';$('addBtn').style.display=on?'none':'inline-block';$('gBtns').style.display=on?'none':'flex';$('count').style.display=on?'none':'inline-block'}
function resetForm(){setAdding(false);if(pending&&pending.el)pending.el.remove();pending=null;$('form').style.display='none';$('fTitle').value='';$('fLink').value='';$('fPrev').hidden=true;$('fMsg').textContent=''}
$('addBtn').onclick=()=>{$('info').style.display='none';setAdding(true)};
function place(e){const r=world.getBoundingClientRect();const x=(e.clientX-r.left)/(W*k),y=(e.clientY-r.top)/(H*k);if(x<0||y<0||x>1||y>1)return;
  if(pending&&pending.el)pending.el.remove();pending={x:+x.toFixed(4),y:+y.toFixed(4)};pending.el=addStar(pending,'pending');setAdding(false);$('count').style.display='inline-block';$('addBtn').style.display='inline-block';$('form').style.display='block';$('fTitle').focus()}
$('formX').onclick=$('cancel').onclick=resetForm;$('infoX').onclick=()=>$('info').style.display='none';
$('fLink').oninput=()=>{const v=$('fLink').value.trim(),p=$('fPrev');if(/^https:\/\//i.test(v)){p.src=v;p.hidden=false;p.onerror=()=>{p.hidden=true}}else p.hidden=true};
$('send').onclick=async()=>{
  const title=$('fTitle').value.trim(),link=$('fLink').value.trim();
  if(!pending)return;
  if(!title){$('fMsg').textContent='Add a name for this location.';return}
  if(!/^https:\/\/\S+$/i.test(link)){$('fMsg').textContent='Paste a link to a picture (starting with https://).';return}
  if(!RELAY_URL){$('fMsg').textContent='Sending is not set up yet. Add your relay URL in the code.';return}
  $('send').disabled=true;$('fMsg').textContent='Sending...';
  try{const r=await fetch(RELAY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({x:pending.x,y:pending.y,title,link,website:$('fWeb').value})});
    if(!r.ok)throw 0;$('fMsg').textContent='Sent. It will show on the map once approved.';setTimeout(()=>{resetForm();$('send').disabled=false},2200)}
  catch(_){$('fMsg').textContent='Could not send. Try again.';$('send').disabled=false}};

/* ============ GUIDES (GTA Online MC businesses) ============ */
/* Fill these in later. facts: [['Label','Value'],...]  steps: ['Step one','Step two']  tip: 'text' */
const GUIDES={
 weed:{name:'Weed',title:'Weed',facts:[],steps:[],tip:'TBD'},
 coke:{name:'Cocaine',title:'Cocaine',facts:[],steps:[],tip:'TBD'},
 meth:{name:'Meth',title:'Meth',facts:[],steps:[],tip:'TBD'},
 heroin:{name:'Heroin',title:'Heroin',facts:[],steps:[],tip:'TBD'}
};
function showGuide(k){const g=GUIDES[k];document.querySelectorAll('#gTabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.k===k));
 let h='<h3>'+g.title+'</h3>';
 if(g.facts.length)h+='<table>'+g.facts.map(f=>'<tr><td>'+f[0]+'</td><td>'+f[1]+'</td></tr>').join('')+'</table>';
 if(g.steps.length)h+='<h3>How it works</h3><ol>'+g.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>';
 h+='<p>'+g.tip+'</p>';
 $('gBody').innerHTML=h}
Object.keys(GUIDES).forEach(k=>{const b=document.createElement('button');b.textContent=GUIDES[k].name;b.dataset.k=k;b.setAttribute('role','tab');b.onclick=()=>showGuide(k);$('gTabs').appendChild(b)});
const SECTIONS={general:'General',drugs:'Drugs',locations:'Locations'};let curSec=null;
function openGuide(s){const g=$('guide');if(curSec===s&&g.style.display==='block'){g.style.display='none';curSec=null;document.querySelectorAll('#gBtns button').forEach(b=>b.removeAttribute('aria-selected'));return}
 curSec=s;$('info').style.display='none';g.style.display='block';document.querySelectorAll('#gBtns button').forEach(b=>b.setAttribute('aria-selected',b.dataset.s===s));
 $('gTabs').style.display=s==='drugs'?'flex':'none';
 if(s==='drugs')showGuide('weed');else $('gBody').innerHTML='<h3>'+SECTIONS[s]+'</h3><p>TBD</p>'}
document.querySelectorAll('#gBtns button').forEach(b=>b.onclick=()=>openGuide(b.dataset.s));
$('guideX').onclick=()=>{$('guide').style.display='none';curSec=null;document.querySelectorAll('#gBtns button').forEach(b=>b.removeAttribute('aria-selected'))};
</script></body></html>
